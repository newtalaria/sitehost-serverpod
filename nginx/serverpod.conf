# talaria-serverpod
# Site file for a Serverpod process on a stock Nginx + PHP container.
# The placeholder line below becomes an optional location for the web server.
# The default site proxies only the API.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream talaria_serverpod_api {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

__WEB_LOCATION__
    location / {
        proxy_pass http://talaria_serverpod_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
