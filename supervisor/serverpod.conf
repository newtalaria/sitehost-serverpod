; talaria-serverpod
[program:serverpod]
directory=__CURRENT__
command=__CURRENT__/bin/server --mode=production --server-id=default --logging=normal --role=monolith__MIGRATIONS__
stdout_logfile=__LOG_DIR__/serverpod-stdout.log
stderr_logfile=__LOG_DIR__/serverpod-stderr.log
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
